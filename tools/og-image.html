<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Open graph image 1200x630. Render by opening this file directly (file://) in headless Chrome at 1200x630; /tools/ is not served. */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
  :root { --paper: #FFFDF8; --ink: #0F2A22; --ink-2: #3D554C; --a: #0B6B53; --b: #FF5A00; --hl: #E14E00; --curve-a: #FCF7EB; --curve-b: #FF5A00; --shade: #08523F; }
  :root.biru { --paper: #F8FAFC; --ink: #0F172A; --ink-2: #475569; --a: #0A43FF; --b: #FF7A00; --hl: #E06200; --curve-a: #00C2FF; --curve-b: #FF7A00; --shade: #0634CC; }
  body { display: grid; grid-template-columns: 1fr 470px; font-family: "Source Sans 3", sans-serif; color: var(--ink); }
  .text { padding: 64px 0 56px 72px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: Lexend; font-weight: 700; font-size: 24px; letter-spacing: .04em; }
  .brand img { height: 46px; }
  .g { color: var(--a); } .o { color: var(--b); }
  h1 { margin: auto 0 0; font-family: Lexend; font-weight: 700; font-size: 68px; line-height: 1.02; letter-spacing: -0.035em; }
  h1 span { color: var(--hl); }
  p { margin: 24px 0 0; font-size: 26px; color: var(--ink-2); line-height: 1.4; }
  .photo { position: relative; margin: 28px 28px 28px 0; border-radius: 22px; overflow: hidden; background: var(--shade); }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
  .photo svg { position: absolute; right: 0; bottom: 0; width: 48%; height: 34%; }
</style></head>
<body>
  <div class="text">
    <div class="brand"><img id="logo" src="../assets/brand/themes/hijau/logo-symbol.png" alt=""><span><span class="g">BIMBEL</span><span class="o">INFINITY</span></span></div>
    <h1>Persiapan PKN STAN, diajar <span>mahasiswanya.</span></h1>
    <p>Bintaro, di depan kampus PKN STAN · sejak 2013</p>
  </div>
  <div class="photo">
    <img src="https://res.cloudinary.com/jnye0bk5/video/upload/so_1/c_crop,w_864,h_1080,x_566,y_0/w_720/e_contrast:10/q_auto/v1794302283/MVI_4058.jpg" alt="">
    <svg viewBox="0 0 600 400" preserveAspectRatio="none"><path d="M600 0C470 60 430 220 250 400H340C480 250 520 120 600 96Z" fill="var(--curve-a)"/><path d="M600 96C520 120 480 250 340 400H600Z" fill="var(--curve-b)"/></svg>
  </div>
<script>/* ?t=biru renders the blue theme */ const t = new URLSearchParams(location.search).get('t') || 'hijau'; document.documentElement.className = t; document.getElementById('logo').src = '../assets/brand/themes/' + t + '/logo-symbol.png';</script>
</body></html>
